<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- Top Search Bar -->
        <div class="search">
            <input type="text" id="city-input" placeholder="Enter city name (e.g., Colombo)" spellcheck="false">
            <button id="search-btn">Search</button>
        </div>

        <div class="error" id="error-msg">
            <p>Invalid city name. Please try again!</p>
        </div>

        <!-- Two-Column Dashboard (Weather Card + Map Panel) -->
        <div class="dashboard" id="dashboard">
            <!-- Left: Weather Card -->
            <div class="card">
                <div class="weather-header">
                    <div>
                        <h2 class="city" id="city">Colombo</h2>
                        <p class="country" id="country">LK</p>
                    </div>
                    <img src="https://openweathermap.org/img/wn/02d@2x.png" class="weather-icon" id="weather-icon" alt="Weather Icon">
                </div>

                <div class="temp-section">
                    <h1 class="temp" id="temp">--°C</h1>
                    <p class="description" id="description">Scattered Clouds</p>
                </div>

                <div class="details">
                    <div class="col">
                        <p class="label">Humidity</p>
                        <p class="humidity" id="humidity">--%</p>
                    </div>
                    <div class="col">
                        <p class="label">Wind Speed</p>
                        <p class="wind" id="wind">-- km/h</p>
                    </div>
                </div>
            </div>

            <!-- Right: Dark Map Panel -->
            <div class="map-card">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
